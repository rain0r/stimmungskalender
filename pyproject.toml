[project]
name = "stimmungskalender"
version = "2.0.0"
description = "Self-hosted mood calendar"
authors = [{ name = "Rainer Hihn", email = "hihn.rainer@gmail.com" }]
requires-python = ">= 3.14"
license = "AGPL-3.0-only"

dependencies = [
    "Django>=5.1.5,<6",
    "dj-database-url>=2.3.0,<3",
    "django-cors-headers>=4.6.0,<5",
    "django-registration>=5.1.0,<6",
    "django-rosetta>=0.10.1,<0.11",
    "djangorestframework>=3.15.2,<4",
    "python-decouple>=3.8,<4",
    "djangorestframework-dataclasses>=1.3.1,<2",
    "pyyaml>=6.0.2,<7",
    "inflection>=0.5.1,<0.6",
    "uritemplate>=4.1.1,<5",
    "uwsgi>=2.0.31",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13,<0.14",
]

[tool.djlint]
profile = "django"
